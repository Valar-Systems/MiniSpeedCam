; PlatformIO Project Configuration File for MiniSpeedCam r1.2
;
; Hardware: ESP32-S3 with OV2640 camera and external PSRAM.
;
; Library versions mirror the Arduino IDE setup of the original sketch:
;   - Async TCP 3.3.8 (esp32async fork, required by ESPUI on Arduino-ESP32 v3)
;   - ESPUI    2.2.4 (s00500)
;
; Photo uploads stream base64-encoded JPEG data directly from PSRAM
; through a custom Stream into HTTPClient::sendRequest(), so we no
; longer need a base64 library.
;
; esp_camera.h and the WiFi / HTTPClient / WiFiClientSecure / Preferences /
; ESPmDNS / DNSServer libraries ship with the espressif32 platform and do
; not need to be listed under lib_deps.

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed  = 921600

; --- ESP32-S3 module options ---------------------------------------------
; Defaults match an ESP32-S3-WROOM-1-N8R8 (8 MB flash, 8 MB OPI PSRAM).
; Change flash_size / memory_type if your module differs (e.g. N16R8).
board_build.arduino.memory_type = qio_opi
board_build.flash_mode          = qio
board_upload.flash_size         = 8MB
board_build.partitions          = huge_app.csv

; --- Compile-time flags --------------------------------------------------
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=0
    ; If your board wires the on-chip native USB to the host (no USB/UART
    ; bridge), uncomment the next two lines so Serial uses the on-chip CDC.
    ; -DARDUINO_USB_MODE=1
    ; -DARDUINO_USB_CDC_ON_BOOT=1

; --- Libraries -----------------------------------------------------------
lib_deps =
    s00500/ESPUI @ 2.2.4
    esp32async/AsyncTCP @ 3.3.8
