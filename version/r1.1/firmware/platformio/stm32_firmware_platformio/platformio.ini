; PlatformIO port of the MiniSpeedCam STM32 firmware (STM32F301K8U6).
;
; This is a self-contained, framework-less build: it vendors the exact same
; sources as the original STM32CubeIDE project (HAL, CMSIS, CMSIS-DSP, FatFs,
; startup, linker script) so there is no risk of a HAL/CMSIS version mismatch.
; PlatformIO only supplies the GNU Arm toolchain and the build orchestration.
;
; Build:   pio run
; Flash:   pio run -t upload      (ST-Link by default)

[platformio]
src_dir = .
include_dir = Core/Inc
boards_dir = boards
default_envs = genericSTM32F301K8

[env:genericSTM32F301K8]
platform = ststm32
board = genericSTM32F301K8
; No framework: everything needed is vendored in this project tree.
build_type = release

; Use the original CubeIDE-generated linker script (64k Flash / 16k RAM).
board_build.ldscript = STM32F301K8UX_FLASH.ld

; Let the libraries fall back to our explicit -I paths only.
lib_ldf_mode = off

; Inject matching arch/specs flags onto the link command (see script).
extra_scripts = pre:link_flags.py

build_unflags =
    -Os

build_flags =
    ; --- target / ABI ---
    -mcpu=cortex-m4
    -mthumb
    -mfpu=fpv4-sp-d16
    -mfloat-abi=hard
    --specs=nano.specs
    --specs=nosys.specs
    -std=gnu11
    -Os
    -ffunction-sections
    -fdata-sections
    -Wall
    ; --- HAL / device ---
    -DUSE_HAL_DRIVER
    -DSTM32F301x8
    ; --- CMSIS-DSP configuration (matches the original project) ---
    -DARM_MATH_CM4
    -DARM_DSP_CONFIG_TABLES
    -DARM_FAST_ALLOW_TABLES
    -DARM_FFT_ALLOW_TABLES
    -DARM_TABLE_TWIDDLECOEF_F32_512
    -DARM_TABLE_BITREVIDX_FLT_512
    -DARM_TABLE_TWIDDLECOEF_RFFT_F32_1024
    -DARM_ALL_FAST_TABLES
    -DARM_MATH_LOOPUNROLL
    -DDISABLEFLOAT16
    ; --- include paths ---
    -ICore/Inc
    -IDrivers/CMSIS/DSP/Include
    -IDrivers/STM32F3xx_HAL_Driver/Inc
    -IDrivers/STM32F3xx_HAL_Driver/Inc/Legacy
    -IDrivers/CMSIS/Device/ST/STM32F3xx/Include
    -IDrivers/CMSIS/Include
    -IFATFS/Target
    -IFATFS/App
    -IMiddlewares/Third_Party/FatFs/src

; Compile exactly the translation units the CubeIDE project builds.
build_src_filter =
    -<*>
    +<Core/Src/>
    +<Core/Startup/>
    +<Drivers/STM32F3xx_HAL_Driver/Src/>
    +<Drivers/CMSIS/DSP/>
    +<FATFS/App/>
    +<FATFS/Target/>
    +<Middlewares/Third_Party/FatFs/src/>

; Debugger / flashing defaults (matches the STM32F301 target).
; Flashing is done over a USB-to-UART adapter (CH340) using the STM32
; built-in ROM serial bootloader via stm32flash. SWD debugging would still
; require an ST-Link, hence debug_tool stays stlink.
debug_tool = stlink
upload_protocol = serial
; CH340 adapter on this machine enumerates as COM6:
upload_port = COM6
; Bootloader baud (stm32flash default is 57600; 115200 also works well).
upload_speed = 115200

; Serial monitor: the CH340 is wired to USART2 (PA2/PA3), which runs at 115200
; in this firmware, and that is where the diagnostic dump is sent. USART1
; (PA9/PA10) is the ESP32 link at 1 Mbaud -- not where the CH340 is.
monitor_port = COM6
monitor_speed = 115200
; Tee the monitor output to a timestamped log file in the project root
; (platformio-device-monitor-*.log) so captured runs can be reviewed/shared.
monitor_filters = log2file
