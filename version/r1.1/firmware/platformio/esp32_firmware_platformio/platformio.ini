; PlatformIO Project Configuration File for MiniSpeedCam r1.1
;
; Hardware: ESP32-S3 with OV2640 camera and external PSRAM.
;
; The web config portal and the aiming-stream server both use the IDF-native
; esp_http_server (ships with the platform); ArduinoJson builds the portal's
; /api/state JSON and parses its POST bodies (and the OTA manifest). There is no
; ESPUI / ESPAsyncWebServer / AsyncTCP dependency anymore -- dropping ESPUI
; removed the async stack whose cross-core WebSocket broadcasts caused the
; rev-1.1 freeze under WiFi load.
;
; The photo upload base64-encodes the JPEG with the Arduino-ESP32 core's
; base64::encode() (cores/esp32/base64.h), so no external base64 library
; is listed under lib_deps.
;
; esp_camera.h and the WiFi / HTTPClient / WiFiClientSecure / Preferences /
; ESPmDNS / DNSServer / SPIFFS libraries ship with the espressif32 platform
; and do not need to be listed under lib_deps.

[env:esp32-s3]
; Espressif no longer maintains the official PlatformIO "espressif32" platform;
; it is frozen at Arduino-ESP32 v2.0.x / ESP-IDF v4.x. This project targets
; Arduino-ESP32 v3 / ESP-IDF v5 (for the current esp_camera + esp_http_server),
; so we pin the community-maintained pioarduino fork, which tracks Arduino v3.
; Pinned to a specific release for reproducible builds (bump the tag to update):
;   55.03.39 = Arduino v3.3.9 based on ESP-IDF v5.5.4.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed  = 921600

; --- ESP32-S3 module options ---------------------------------------------
; Defaults match an ESP32-S3-WROOM-1-N8R8 (8 MB flash, 8 MB OPI PSRAM).
; Change flash_size / memory_type if your module differs (e.g. N16R8).
board_build.arduino.memory_type = qio_opi
board_build.flash_mode          = qio
board_upload.flash_size         = 8MB
;
; Custom dual-app 8 MB layout (partitions_8mb_ota.csv) -- enables OTA:
;   nvs      0x009000   20 KB    -- preferences (WiFi creds, settings) [unchanged]
;   otadata  0x00E000    8 KB    -- selects which app slot to boot
;   app0     0x010000  2.81 MB   -- firmware slot A (ota_0)
;   app1     0x2E0000  2.81 MB   -- firmware slot B (ota_1)
;   spiffs   0x5B0000  2.19 MB   -- SPIFFS.begin() data partition
;   coredump 0x7E0000  128 KB    -- esp_core_dump to-flash crash backtraces
;
; Two app slots are required for OTA (download into the inactive slot, flip on
; reboot, roll back if it doesn't boot clean). NVS keeps the standard 0x9000
; offset so stored WiFi creds + settings survive migrating onto this table.
; NOTE: moving from the old single-slot huge_app.csv needs ONE wired flash per
; unit; SPIFFS contents are wiped by that layout change (NVS/creds are not).
board_build.partitions          = partitions_8mb_ota.csv

; --- Compile-time flags --------------------------------------------------
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=0
    ; This board wires the on-chip native USB to the host (no USB/UART
    ; bridge), so Serial must use the on-chip CDC.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; ESP32 firmware version: reported in the heartbeat and used by the OTA
    ; flow to decide whether this board needs updating. Bump on every release.
    '-DFW_VERSION="1.0.7"'
    ; Bootstrap token for register_device/capture transport auth. Sourced from
    ; the environment so the secret is never committed: set MSC_BOOTSTRAP_TOKEN
    ; before building (PowerShell: $env:MSC_BOOTSTRAP_TOKEN="..."; bash:
    ; export MSC_BOOTSTRAP_TOKEN=...). config.h #errors if the flag is absent.
    '-DAPI_BEARER_TOKEN="${sysenv.MSC_BOOTSTRAP_TOKEN}"'
    ; For production, point the API at version-live (default is version-test):
    ; '-DAPI_BASE_URL="https://minispeedcam.com/version-live/api/1.1/wf"'

; --- Libraries -----------------------------------------------------------
; ArduinoJson is the only third-party dependency: it builds the config portal's
; /api/state response + parses its POST bodies, and parses the OTA firmware-check
; manifest (header-only). The HTTP servers (config portal :80, aiming stream :81)
; use the platform's built-in esp_http_server, which needs no lib_deps entry.
lib_deps =
    bblanchon/ArduinoJson @ ^7.2.0
